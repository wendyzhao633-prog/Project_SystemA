# ############################################################################
# RAVDESS Speech Emotion Recognition — ECAPA-TDNN + Class-Weighted CE
#
# Identical to train_ravdess.yaml EXCEPT:
#   1. use_class_weights: True  — uses F.cross_entropy(weight=...) instead of
#      LogSoftmaxWrapper + AAM.  Weights are computed automatically from
#      train.json using the balanced formula: w_c = N / (C * n_c).
#   2. Independent result directories — does NOT overwrite ECAPA baseline.
#
# Everything else is unchanged:
#   • backbone, embedding, classifier structure  — identical to ECAPA baseline
#   • batch_size, lr, scheduler, epochs          — identical to ECAPA baseline
#   • data split, label order, sample_id         — identical to ECAPA baseline
#   • best checkpoint criterion                  — max validation UAR
#
# Result isolation:
#   checkpoints → results/ECAPA_weighted/1968/save/
#   predictions → outputs/predictions_ecapa_weighted/
#   embeddings  → outputs/embeddings_ecapa_weighted/
#
# Comparison:
#   ECAPA baseline         : hparams/train_ravdess.yaml
#   ECAPA + weighted CE    : hparams/train_ravdess_ecapa_weighted.yaml  ← this
# ############################################################################

# Reproducibility
seed: 1968
__set_seed: !apply:speechbrain.utils.seed.seed_everything [!ref <seed>]

# ── Class-weighted loss ────────────────────────────────────────────────────
# When True, train.py reads train.json, counts samples per class, computes
# balanced weights (w_c = N / (C * n_c)), and uses F.cross_entropy(weight=...).
# Class counts and weights are printed at training start.
use_class_weights: True

# ── Paths ──────────────────────────────────────────────────────────────────
metadata_dir: C:/Users/NannanLi/Desktop/speechbrain-develop/metadata

train_annotation: !ref <metadata_dir>/train.json
valid_annotation: !ref <metadata_dir>/valid.json
test_annotation:  !ref <metadata_dir>/test.json

# ── Output directories — SEPARATE from original ECAPA baseline ─────────────
results_root:  C:/Users/NannanLi/Desktop/speechbrain-develop/recipes/RAVDESS_emotion_recognition/results/ECAPA_weighted
output_folder: !ref <results_root>/<seed>
save_folder:   !ref <output_folder>/save
train_log:     !ref <output_folder>/train_log.txt

predictions_dir: C:/Users/NannanLi/Desktop/speechbrain-develop/outputs/predictions_ecapa_weighted
embeddings_dir:  C:/Users/NannanLi/Desktop/speechbrain-develop/outputs/embeddings_ecapa_weighted

skip_prep: True

# ── Task ───────────────────────────────────────────────────────────────────
out_n_neurons: 8

# ── Training hyperparameters (identical to ECAPA baseline) ─────────────────
number_of_epochs: 30
batch_size: 8
lr: 0.0001
weight_decay: 0.00002
base_lr: 0.000001
max_lr: !ref <lr>
step_size: 480
mode: exp_range
gamma: 0.9998
shuffle: True
drop_last: False

# ── Feature parameters (identical to ECAPA baseline) ───────────────────────
n_mels: 80
left_frames: 0
right_frames: 0
deltas: False

# ── DataLoader ─────────────────────────────────────────────────────────────
dataloader_options:
    batch_size: !ref <batch_size>
    shuffle:    !ref <shuffle>
    num_workers: 0
    drop_last:  !ref <drop_last>

# ── Logger ─────────────────────────────────────────────────────────────────
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

ckpt_interval_minutes: 15

# ── Model components (identical to ECAPA baseline) ─────────────────────────
compute_features: !new:speechbrain.lobes.features.Fbank
    n_mels:       !ref <n_mels>
    left_frames:  !ref <left_frames>
    right_frames: !ref <right_frames>
    deltas:       !ref <deltas>

mean_var_norm: !new:speechbrain.processing.features.InputNormalization
    norm_type: sentence
    std_norm: False

embedding_model: !new:speechbrain.lobes.models.ECAPA_TDNN.ECAPA_TDNN
    input_size:        !ref <n_mels>
    channels:          [512, 512, 512, 512, 1536]
    kernel_sizes:      [5, 3, 3, 3, 1]
    dilations:         [1, 2, 3, 4, 1]
    attention_channels: 64
    lin_neurons:       96

classifier: !new:speechbrain.lobes.models.ECAPA_TDNN.Classifier
    input_size:  96
    out_neurons: !ref <out_n_neurons>

# ── Loss ───────────────────────────────────────────────────────────────────
# compute_cost is kept here but is NOT called when use_class_weights=True.
# train.py uses F.cross_entropy(weight=class_weights) in that branch.
compute_cost: !new:speechbrain.nnet.losses.LogSoftmaxWrapper
    loss_fn: !new:speechbrain.nnet.losses.AdditiveAngularMargin
        margin: 0.2
        scale: 30

# ── Optimizer & scheduler (identical to ECAPA baseline) ────────────────────
opt_class: !name:torch.optim.Adam
    lr:           !ref <lr>
    weight_decay: !ref <weight_decay>

lr_annealing: !new:speechbrain.nnet.schedulers.CyclicLRScheduler
    mode:      !ref <mode>
    gamma:     !ref <gamma>
    base_lr:   !ref <base_lr>
    max_lr:    !ref <max_lr>
    step_size: !ref <step_size>

# ── Epoch loop ─────────────────────────────────────────────────────────────
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

# ── Modules dict ───────────────────────────────────────────────────────────
modules:
    compute_features: !ref <compute_features>
    mean_var_norm:    !ref <mean_var_norm>
    embedding_model:  !ref <embedding_model>
    classifier:       !ref <classifier>

# ── Checkpointer ───────────────────────────────────────────────────────────
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        embedding_model: !ref <embedding_model>
        classifier:      !ref <classifier>
        normalizer:      !ref <mean_var_norm>
        counter:         !ref <epoch_counter>
        lr_annealing:    !ref <lr_annealing>
