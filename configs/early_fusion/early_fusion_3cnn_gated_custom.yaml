model_name: early_fusion_3cnn
run_name: early_fusion_3cnn_gated_custom
seed: 42

data:
  train_manifest: data/manifests/custom/av_train.csv
  valid_manifest: data/manifests/custom/av_valid.csv
  test_manifest: data/manifests/custom/av_test.csv
  sample_rate: 16000
  n_fft: 400
  hop_length: 160
  win_length: 400
  n_mels: 80
  audio_num_frames: 256
  num_video_frames: 5
  image_size: 224
  use_face_crop: false
  enable_cache: true
  audio_cache_root: data/processed/custom/early_fusion_cache/audio_logmel_sr16000_mel80_t256
  video_cache_root: data/processed/custom/early_fusion_cache/video_frames_5f_224
  # Custom dataset: skip RAVDESS filename-pattern av_key validation
  validate_ravdess_av_key: false
  # No PPG — audio+video only, for comparison baseline
  train_audio_gain_jitter_db: 1.0
  train_specaug_freq_mask_width: 4
  train_specaug_time_mask_width: 8
  train_video_random_crop_scale_min: 0.95
  train_video_horizontal_flip_prob: 0.5
  train_video_brightness_jitter: 0.05
  train_video_contrast_jitter: 0.05

train:
  batch_size: 8
  num_workers: 2
  epochs: 100
  lr: 0.0003
  weight_decay: 0.0001
  patience: 20
  grad_clip_norm: 1.0
  scheduler_name: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 6
  scheduler_min_lr: 0.000001

model:
  dropout: 0.4
  num_classes: 8
  gating_enabled: true
  gating_hidden_dim: 64
  gating_scale_floor: 0.5
